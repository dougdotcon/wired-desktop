[Session]
window_manager=openbox-lxde
disable_autostart=no
polkit/command=lxpolkit
clipboard/command=lxclipboard
xsettings_manager/command=build-in
proxy_manager/command=build-in
keyring/command=ssh-agent
quit_manager/command=lxsession-logout
lock_manager/command=lxlock
terminal_manager/command=/home/dougdotcon/.local/bin/wired-terminal
quit_manager/image=/home/dougdotcon/.local/share/icons/wired/logout-banner.png
quit_manager/layout=top

[GTK]
sNet/ThemeName=Adwaita
sNet/IconThemeName=wired
sGtk/FontName=DejaVu Sans Mono 9
iGtk/ToolbarStyle=3
iGtk/ButtonImages=1
iGtk/MenuImages=1
iGtk/CursorThemeSize=18
iXft/Antialias=1
iXft/Hinting=1
sXft/HintStyle=hintslight
sXft/RGBA=rgb
iNet/EnableEventSounds=1
iNet/EnableInputFeedbackSounds=1
sGtk/ColorScheme=fg_color:#c8f5d4,bg_color:#101612,base_color:#070b09,text_color:#c8f5d4,selected_bg_color:#143028,selected_fg_color:#9dffb0,tooltip_bg_color:#0c1410,tooltip_fg_color:#c8f5d4
iGtk/ToolbarIconSize=2
sGtk/CursorThemeName=DMZ-White

[Mouse]
AccFactor=20
AccThreshold=10
LeftHanded=0

[Keyboard]
Delay=500
Interval=30
Beep=0

[State]
guess_default=true

[Dbus]
lxde=true

[Environment]
menu_prefix=lxde-
